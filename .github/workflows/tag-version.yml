name: Tag Release from package.json

on:
  push:
    branches:
      - main
  workflow_dispatch:
      
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  tag:
    if: github.repository_owner == 'opencorex-org'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.pkg.outputs.release_tag }}
      tag_created: ${{ steps.check_tag.outputs.tag_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Get version from package.json
        id: pkg
        run: |
          VERSION="$(node -e "const v=require('./package.json').version;if(!/^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(v)){console.error('Invalid package version:',v);process.exit(1)}process.stdout.write(v)")"
          echo "VERSION=v${VERSION}" >> "$GITHUB_ENV"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            echo "EXISTS=true" >> $GITHUB_ENV
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $VERSION does not exist."
            echo "EXISTS=false" >> $GITHUB_ENV
            echo "tag_created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous tag
        if: env.EXISTS == 'false'
        run: |
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_ENV

      - name: Generate release notes
        if: env.EXISTS == 'false'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          node ./scripts/generate-release-notes.mjs

      - name: Set up Git user
        if: env.EXISTS == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: env.EXISTS == 'false'
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin $VERSION

      - name: Create GitHub Release
        if: env.EXISTS == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.4
        with:
          tag_name: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-publish:
    needs: tag
    if: needs.tag.outputs.tag_created == 'true' && github.repository_owner == 'opencorex-org'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch npm publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.tag.outputs.release_tag }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$RELEASE_TAG"
