name: Publish Package to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'opencorex-org'
    runs-on: ubuntu-latest
    environment:
      name: npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
        with:
          version: 10.28.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@12.0.1

      - name: Verify release identity
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Expected tag ${EXPECTED_TAG}, received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not resolve to release commit ${GITHUB_SHA}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release commit ${GITHUB_SHA} is not reachable from origin/main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc --noEmit -p examples/tsconfig.json

      - name: Run tests
        run: pnpm test

      - name: Pack and verify installable artifact
        run: pnpm run package:verify

      - name: Publish verified artifact with provenance
        run: npm publish "$(cat .package-tarball)" --access public --provenance
