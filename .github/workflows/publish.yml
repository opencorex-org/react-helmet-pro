name: Publish Package to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'opencorex-org'
    runs-on: ubuntu-latest
    environment:
      name: npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@12.0.1

      - name: Verify release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Expected tag ${EXPECTED_TAG}, received ${RELEASE_TAG}." >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [[ "${TAG_COMMIT}" != "${CHECKED_OUT_COMMIT}" ]]; then
            echo "Tag ${RELEASE_TAG} does not resolve to checked-out commit ${CHECKED_OUT_COMMIT}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${CHECKED_OUT_COMMIT}" origin/main; then
            echo "Release commit ${CHECKED_OUT_COMMIT} is not reachable from origin/main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm exec tsc --noEmit
          pnpm exec tsc --noEmit -p examples/tsconfig.json

      - name: Run tests
        run: pnpm test

      - name: Pack and verify installable artifact
        run: pnpm run package:verify

      - name: Publish verified artifact with provenance
        run: npm publish "$(cat .package-tarball)" --access public --provenance
